<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
font-family:Arial;
max-width:900px;
margin:auto;
padding:20px;
}

input,textarea{
width:100%;
padding:10px;
margin:5px 0;
}

button{
padding:10px 20px;
margin-top:10px;
cursor:pointer;
}

.product{
border:1px solid #ddd;
padding:10px;
margin-top:10px;
}

</style>
</head>

<body>

<h1>Admin Dashboard</h1>

<div id="login">

<h2>Login</h2>

<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">

<button onclick="login()">Login</button>

</div>

<div id="dashboard" style="display:none">

<h2>Add Product</h2>

<input id="name" placeholder="product name">
<input id="price" placeholder="price">
<input id="image" placeholder="image url">
<textarea id="desc" placeholder="description"></textarea>

<button onclick="addProduct()">Add Product</button>

<h2>Products</h2>

<div id="products"></div>

</div>

<script>

const supabase = supabase.createClient(
"https://gzoznyjxkiuqxlevkhfz.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6b3pueWp4a2l1cXhsZXZraGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2MDY3MjEsImV4cCI6MjA4NjE4MjcyMX0.HD2bZDGcQb4y8hm0ke243VWdZg2bXsBir-Pz3CDlulM"
);

async function login(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const {data,error}=await supabase.auth.signInWithPassword({
email,
password
});

if(error){

alert(error.message);

}else{

document.getElementById("login").style.display="none";
document.getElementById("dashboard").style.display="block";

loadProducts();

}

}

async function addProduct(){

const name=document.getElementById("name").value;
const price=document.getElementById("price").value;
const image=document.getElementById("image").value;
const desc=document.getElementById("desc").value;

const {error}=await supabase
.from("products")
.insert([{name,price,image,desc}]);

if(error){

alert(error.message);

}else{

alert("product added");

loadProducts();

}

}

async function loadProducts(){

const {data,error}=await supabase
.from("products")
.select("*")
.order("id",{ascending:false});

const container=document.getElementById("products");

container.innerHTML="";

data.forEach(p=>{

container.innerHTML+=`
<div class="product">

<b>${p.name}</b><br>
${p.price}<br>

<img src="${p.image}" width="120"><br>

${p.desc}

</div>
`;

});

}

</script>

</body>
</html>
